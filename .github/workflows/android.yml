name: Android app

# Every push to main builds a test APK ("VolleyIQ Android (latest build)", a pre-release).
# A stable release: Actions > Android app > Run workflow on main with a version (e.g. 1.2.0),
# or push a tag (git tag v1.2.0 && git push origin v1.2.0). Either makes the release "VolleyIQ v1.2.0".
on:
  push:
    # Only main: one build per change (a second branch would race it for the test release).
    branches: [main]
    tags: ["v*"]
    paths: ["web/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Version for a stable release, e.g. 1.2.0 (empty = test build only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      # Stable: the tag or the version typed in. Test builds: the next patch after the latest
      # release plus the build number (after v1.0.0: 1.0.1-dev.86), so they never look older.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.release }}" ]; then v="${{ inputs.release }}"; v="${v#v}"
          else
            last=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            last="${last#v}"
            if [[ "$last" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"; else base="0.0.1"; fi
            v="$base-dev.${{ github.run_number }}"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = tag ] || [ -n "${{ inputs.release }}" ]; then echo "STABLE=1" >> "$GITHUB_ENV"; fi

      - name: Unit tests + APK
        working-directory: web/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../VolleyIQ.apk
          # Same file under a per-build name: a download can't be cut short by the next build replacing it.
          cp ../../VolleyIQ.apk "../../VolleyIQ-$VERSION_NAME.apk"
          echo "APK_MB=$(( $(stat -c %s ../../VolleyIQ.apk) / 1048576 ))" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: VolleyIQ-apk
          path: VolleyIQ.apk

      # Stable release for a version tag: …/releases/latest/download/VolleyIQ.apk always points to it.
      - name: Publish release
        if: env.STABLE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: VolleyIQ v${{ env.VERSION }}
          make_latest: true
          files: |
            VolleyIQ.apk
            VolleyIQ-${{ env.VERSION }}.apk
          body: |
            Android app, version ${{ env.VERSION }} (about ${{ env.APK_MB }} MB). On your phone: tap **VolleyIQ.apk** below, open it, and allow installing from your browser if Android asks.
            The website and server for this version: `git checkout v${{ env.VERSION }}` (see the README to run it).
            What changed: see CHANGELOG.md.

      # A fixed download link for test builds: Releases → "VolleyIQ Android (latest build)".
      - name: Publish latest build
        if: env.STABLE != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VolleyIQ Android (latest build)
          prerelease: true
          files: |
            VolleyIQ.apk
            VolleyIQ-${{ env.VERSION }}.apk
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}), version ${{ env.VERSION }}, about ${{ env.APK_MB }} MB. For a stable version, use the newest "VolleyIQ v…" release instead.
            On your phone: tap **VolleyIQ-${{ env.VERSION }}.apk** below, open it, and allow installing from your browser if Android asks.
            If Android says the package is invalid, the download was incomplete: delete it and download again (it should be about ${{ env.APK_MB }} MB).

      # Keeps the two newest, so a download of the previous build that is still running isn't cut off either.
      - name: Remove older per-build APKs from the release
        if: env.STABLE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -E '^VolleyIQ-(0\.[0-9]+|[0-9.]+-dev\.[0-9]+)\.apk$' || true; } \
            | awk '{ n = $0; sub(/\.apk$/, "", n); sub(/.*[.]/, "", n); print n, $0 }' | sort -n | cut -d' ' -f2- | head -n -2)
          for name in $old; do gh release delete-asset android-latest "$name" --repo "$GITHUB_REPOSITORY" --yes; done
