name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Unit tests + APK
        working-directory: web/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../VolleyIQ.apk
          # Same file under a per-build name: a download can't be cut short by the next build replacing it.
          cp ../../VolleyIQ.apk ../../VolleyIQ-0.${{ github.run_number }}.apk
          echo "APK_MB=$(( $(stat -c %s ../../VolleyIQ.apk) / 1048576 ))" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: VolleyIQ-apk
          path: VolleyIQ.apk

      # A fixed download link for the phone: Releases → "VolleyIQ Android (latest build)".
      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VolleyIQ Android (latest build)
          prerelease: true
          files: |
            VolleyIQ.apk
            VolleyIQ-0.${{ github.run_number }}.apk
          body: |
            Latest Android build from `${{ github.ref_name }}` (${{ github.sha }}), version 0.${{ github.run_number }}, about ${{ env.APK_MB }} MB.
            On your phone: tap **VolleyIQ-0.${{ github.run_number }}.apk** below, open it, and allow installing from your browser if Android asks.
            If Android says the package is invalid, the download was incomplete: delete it and download again (it should be about ${{ env.APK_MB }} MB).

      # Keeps the two newest, so a download of the previous build that is still running isn't cut off either.
      - name: Remove older per-build APKs from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep -E '^VolleyIQ-0\.[0-9]+\.apk$' || true; } | sort -t. -k2,2n | head -n -2)
          for name in $old; do gh release delete-asset android-latest "$name" --repo "$GITHUB_REPOSITORY" --yes; done
