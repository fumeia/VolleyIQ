name: Clean up APK copies

# The copies of the APK on the run pages (artifacts, 84 MB each) fill GitHub's artifact storage, and
# a full storage makes the next build fail. The releases keep every APK that is downloaded; these
# copies are only for looking at a single run. Deletes all but the newest few, by hand or every week.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "How many of the newest copies to keep"
        required: false
        default: "3"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep || '3' }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +$((KEEP + 1)) | cut -f2)
          n=0
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && n=$((n + 1)); done
          echo "Deleted $n artifacts, kept the newest $KEEP."
