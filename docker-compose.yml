services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "true"
    volumes:
      - ./data:/data

  worker:
    build:
      context: ./worker
      args:
        VISION: ${VISION:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://app:3000
      VIDEOS_DIR: /data/videos
      CACHE_DIR: /data/cache
    volumes:
      - ./data:/data
    depends_on: [app]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
