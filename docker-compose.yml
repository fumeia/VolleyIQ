# Only the small API + web app runs on the server (~80 MB RAM, a few MB of data).
# Videos and auto-detection stay on the phone. Put it behind your existing
# reverse proxy (see README), so no ports 80/443 are taken here.
services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "true"
      # Inside the container the app always listens on 3000; PORT in .env only picks the host port.
      PORT: "3000"
    ports:
      - "127.0.0.1:${PORT:-3080}:3000"
    volumes:
      - ./data:/data
    mem_limit: 192m
    cpus: 0.5

  # Makes 720p and 480p versions of uploaded match videos, one at a time, at the lowest CPU
  # priority (TRANSCODE_HOURS in .env: only at night). Only runs when video storage (S3_* in
  # .env) is set up; install.sh turns it on.
  transcoder:
    build:
      context: .
      target: transcoder
    profiles: [video]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    mem_limit: 512m
    cpus: 2.0
