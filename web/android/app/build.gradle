apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.volleyiq.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.volleyiq.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName(System.getenv("VERSION_NAME") ?: "0.1-dev")
        ndk {
            // Modern phones only: keeps the APK small (yt-dlp/Python and ML models ship native code).
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Every build must be signed with the same key, or Android refuses to install updates.
            // keystore/sideload.jks is committed for personal sideloading only. Before publishing
            // anywhere, set ANDROID_KEYSTORE_* (e.g. from GitHub secrets) to use a private key instead.
            def ks = System.getenv("ANDROID_KEYSTORE_FILE")
            storeFile ks ? file(ks) : rootProject.file("keystore/sideload.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "volleyiq-sideload"
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "volleyiq"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "volleyiq-sideload"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        // youtubedl-android extracts its bundled Python/ffmpeg from the native libs folder.
        jniLibs { useLegacyPackaging = true }
    }
    androidResources {
        noCompress 'tflite'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mediapipe:tasks-vision:0.10.14"
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.1.21"
    testImplementation "junit:junit:$junitVersion"
    // Real org.json for JVM unit tests (the Android stub returns nulls there).
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
